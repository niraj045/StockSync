spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shuttering_inventory}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:inventory_user}
    password: ${DB_PASSWORD:inventory_password}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    session:
      cookie:
        secure: false
