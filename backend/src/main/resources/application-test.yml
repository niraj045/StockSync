spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:shuttering_inventory_test}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${TEST_DB_USER:inventory_user}
    password: ${TEST_DB_PASSWORD:inventory_password}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    clean-disabled: false

server:
  servlet:
    session:
      cookie:
        secure: false
