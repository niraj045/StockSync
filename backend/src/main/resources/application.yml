spring:
  application:
    name: stocksync-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

stocksync:
  file-storage-path: ${FILE_STORAGE_PATH:./storage}
  billing:
    auto:
      enabled: ${AUTO_BILLING_ENABLED:true}
      cron: ${AUTO_BILLING_CRON:0 15 2 * * *}
