spring:
  datasource:
    url: jdbc:mysql://${E2E_DB_HOST:127.0.0.1}:${E2E_DB_PORT:3009}/shuttering_inventory_e2e?serverTimezone=UTC
    username: ${E2E_DB_USER:inventory_user}
    password: ${E2E_DB_PASSWORD:inventory_password}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${E2E_BACKEND_PORT:8081}
  servlet:
    session:
      cookie:
        secure: false

stocksync:
  file-storage-path: ${E2E_STORAGE_PATH:../e2e-data}
  e2e:
    expected-database: shuttering_inventory_e2e
